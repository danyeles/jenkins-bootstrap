# Run one Jenkins controller; its home directory is the durable, host-side runtime state.
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc
    group_add:
      # Jenkins needs the socket's host group to manage containers in deployment jobs.
      - "${DOCKER_GID}"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_home/casc:ro
      - ./seed-jobs:/var/jenkins_home/seed-jobs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    
      - /mnt/Backups:/mnt/Backups
      - /mnt/Media:/mnt/Media
      - /mnt:/mnt
      - /home/docker:/home/docker
