# Register the public shared library globally; HTTPS access requires no credentials or SSH keys.
unclassified:
  globalLibraries:
    libraries:
      - name: jenkins-shared-lib
        defaultVersion: master
        implicit: true
        allowVersionOverride: false
        includeInChangesets: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: https://github.com/danyeles/jenkins-shared-lib.git
      # Existing jenkins-infra/seed.groovy currently uses this older library identifier.
      - name: my-shared-lib
        defaultVersion: master
        implicit: false
        allowVersionOverride: false
        includeInChangesets: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: https://github.com/danyeles/jenkins-shared-lib.git
